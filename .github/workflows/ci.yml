name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # 🔒 Postgres THẬT — không dùng SQLite. Exclusion constraint và RLS
      #    không tồn tại ở đó, test sẽ xanh giả (docs/14-testing-strategy.md)
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: garageos
          POSTGRES_PASSWORD: garageos_dev
          POSTGRES_DB: garageos
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U garageos -d garageos"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgresql://garageos_app:garageos_app_dev@localhost:5433/garageos
      DATABASE_ADMIN_URL: postgresql://garageos:garageos_dev@localhost:5433/garageos
      REDIS_URL: redis://localhost:6380
      # 🔒 Giá trị chỉ dùng cho CI, đủ dài và khác nhau — assertSecretsUsable()
      #    từ chối khởi động nếu hai bí mật trùng nhau hoặc là giá trị mẫu.
      JWT_ACCESS_SECRET: ci-only-6Qx2vN8pLmT4wZ1jR7yB3kH5sD9fA0cE
      JWT_REFRESH_SECRET: ci-only-9Wp3zK7nQ2mV5xJ8tY4bC6hL1dS0gF3r
      # Nới rate limit CHỈ trong CI để test tích hợp chạy được.
      # ⚠️ Không bao giờ đặt biến này ở production.
      LOGIN_RATE_LIMIT_MAX: '1000'
      # Trả mã OTP trong response để test luồng duyệt báo giá chạy được.
      # ⚠️ Chỉ ở CI. Không bao giờ đặt ở production.
      OTP_DEV_ECHO: 'true'
      # E2E cần danh sách tài khoản demo hiển thị trên trang đăng nhập
      NEXT_PUBLIC_DEMO_HINTS: '1'

    steps:
      - uses: actions/checkout@v4
      # Không khai báo `version` ở đây — action tự đọc `packageManager` trong
      # package.json. Khai báo cả hai chỗ gây lỗi ERR_PNPM_BAD_PM_VERSION.
      # Một nguồn sự thật duy nhất cho phiên bản pnpm: package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm db:seed

      # Build TRƯỚC khi chạy test, và khởi động API bằng BẢN ĐÃ BIÊN DỊCH.
      #
      # Bản trước chạy `pnpm --filter @garageos/api dev` (tsx watch) nên toàn bộ
      # test đi qua loader của tsx, còn `node dist/main.js` — thứ thật sự chạy ở
      # production — không bao giờ được khởi động. Mọi lỗi chỉ có ở artifact đã
      # biên dịch (file bị tsconfig.build loại ra, đường import mà tsx phân giải
      # được còn Node thuần thì không, khác biệt emitDecoratorMetadata giữa tsx
      # và tsc — đúng cái bẫy `this.xxx is undefined` đã ghi trong STATUS.md)
      # sẽ đi qua CI xanh và chết ở lần deploy đầu tiên.
      #
      # Web đã làm đúng từ đầu (`next start`); API thì chưa.
      - name: Build production
        run: pnpm build

      # GARAGEOS-004: test tích hợp của API cần API ĐANG CHẠY. Thiếu bước này
      # thì `before` hook ném lỗi connection refused và CI đỏ.
      - name: Khởi động API nền (bản đã biên dịch)
        run: |
          pnpm --filter @garageos/api start &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3001/health && break
            sleep 2
          done
          curl -sf http://localhost:3001/health || { echo "API không khởi động được"; exit 1; }

      - run: pnpm test

      # 🔒 Job không được phép bỏ qua: kiểm tra thuộc tính TOÀN HỆ THỐNG.
      #    Tự động áp dụng cho bảng thêm mới sau này.
      #    (Trước đây script này trỏ vào cùng tập test với `pnpm test` — chạy lại
      #     y nguyên, thêm 0 độ phủ. Giờ nó trỏ vào schema-invariants.spec.ts.)
      - name: Kiểm tra bất biến kiến trúc
        run: pnpm test:invariants

      # Seed phải chạy lại được SAU KHI test đã sinh dữ liệu.
      # CI trước luôn seed trên database rỗng, nên không bao giờ phát hiện việc
      # danh sách bảng cần dọn bị thiếu — lỗi chỉ xuất hiện ở máy dev.
      - name: Seed lại trên database đã có dữ liệu
        run: pnpm db:seed

      # Migration phải chỉ-tiến: chạy lại không được đổi gì.
      - name: Migration chạy lại phải không có gì mới
        run: |
          out=$(pnpm db:migrate)
          echo "$out"
          echo "$out" | grep -q "Không có migration mới" || {
            echo "❌ Chạy lại migration lại thực thi thêm — migration không idempotent"
            exit 1
          }

      # E2E là nơi DUY NHẤT kiểm chứng được các lỗi chỉ xuất hiện trong trình
      # duyệt — ví dụ WEB-001 (đọc state cũ của React). Không chạy ở CI thì test
      # đó chỉ là bằng chứng một lần, không phải hàng rào.
      - name: Cài trình duyệt cho Playwright
        run: pnpm exec playwright install chromium --with-deps

      - name: Khởi động web nền
        run: |
          pnpm --filter @garageos/web start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/dang-nhap >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/dang-nhap >/dev/null || { echo "Web không khởi động được"; exit 1; }

      # E2E gồm cả kiểm tra accessibility tự động bằng axe-core trên 4 màn hình.
      # Lỗi accessibility nặng nhất của dự án (nút duyệt báo giá không có tên
      # riêng theo hạng mục) đã lọt qua 17 kịch bản E2E viết tay — chính chúng
      # phải chọn theo class CSS để vòng qua vấn đề thay vì phát hiện nó.
      - name: E2E
        run: pnpm e2e

      - name: Lưu ảnh chụp khi E2E hỏng
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-that-bai
          path: test-results/
          retention-days: 7
