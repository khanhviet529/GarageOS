services:
  postgres:
    image: postgres:16-alpine
    container_name: garageos-postgres
    environment:
      POSTGRES_USER: garageos
      POSTGRES_PASSWORD: garageos_dev
      POSTGRES_DB: garageos
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garageos -d garageos"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: garageos-redis
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
